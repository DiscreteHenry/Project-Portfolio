# dataset.yaml for Protein Crystal Counting

# Path to the dataset root directory (relative to where train_model.py is run from)
# This path should contain the 'images' and 'labels' subdirectories
path: ../data/processed_seed_data # This will be processed_iterN_data in later iterations

# Training and Validation image paths and YOLO .txt label paths
train:
  images: images/train
  labels: labels/train # <--- CHANGE THIS: Point directly to the YOLO .txt files
val:
  images: images/val
  labels: labels/val   # <--- CHANGE THIS
test:
  images: images/test
  labels: labels/test  # <--- CHANGE THIS

# Number of classes
nc: 1

# Class names (must match the order used during COCO to YOLO conversion)
names: ['crystal']